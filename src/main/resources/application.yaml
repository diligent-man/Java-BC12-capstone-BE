server:
    address: ${APPLICATION_ADDRESS}
    port: ${APPLICATION_PORT}

    # performance tuning
    tomcat:
        threads:
            max: 200       # Max worker threads
            min-spare: 10  # Min idle threads
        max-connections: 10000
        accept-count: 100
        connection-timeout: 20000

spring:
    application:
        name: capstone

    datasource:
        url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?connectionTimeZone=Asia/Ho_Chi_Minh&forceConnectionTimeZoneToSession=true
        username: ${MYSQL_USER}
        password: ${MYSQL_PASSWORD}

        # performance tuning
        hikari:
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000
    jpa:
        show-sql: false
        generate-ddl: false
        open-in-view: false  # Disable OSIV — prevents lazy loading in views

        hibernate:
            ddl-auto: validate

        properties:
            hibernate:
                format_sql: true
                highlight_sql: true

                # performance tuning
                default_batch_fetch_size: 16

                jdbc:
                    batch_size: 50
                generate_statistics: false  # Enable for debugging, disable in prod
    devtools:
        restart:
            enabled: true

    data:
        web:
            pageable:
                default-page-size: 20
                max-page-size: 100
                one-indexed-parameters: false   # if true, page starts at 1 instead of 0
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD}
            timeout: 5000ms
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 100MB

    #    cache:
    #        type:
    #            redis:
    #                time-to-live: 100000        # ms — entries auto-expire after 10 min
    #                cache-null-values: false
    #                key-prefix: "products::"
    #                use-key-prefix: true

    mvc:
        problemdetails:
            enabled: true



jwt:
    secret: ${JWT_SIGN}
    #    expiration: 900000 # 15 mins
    expiration: 86400000 # 15 mins

auth:
    max-attempt: 3
    lock-duration: 900000 # 15 mins

file:
    root: ${DATA_ROOT}

    upload:
        image:
            path: ${UPLOAD_IMAGE_PATH}
            default-image: ${DEFAULT_VARIANT_IMAGE_NAME}
            default-separator: ", "

cache:
    product:
        prefix: product
        all:
            cache-duration: 900000 # 15 mins

    brand:
        prefix: brand
        all:
            cache-duration: 900000 # 15 mins

    color:
        prefix: color
        all:
            cache-duration: 900000 # 15 mins

    size:
        prefix: size
        all:
            cache-duration: 900000 # 15 mins

    country:
        prefix: country
        all:
            cache-duration: 900000 # 15 mins

    payment:
        method:
            prefix: payment_method
            all:
                cache-duration: 900000 # 15 mins

    account:
        prefix: account

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: always

payment:
    bank-transfer:
        bank-id: ${VIETQR_BANK_ID}
        account-no: ${VIETQR_ACCOUNT_NO}
        account-name: ${VIETQR_ACCOUNT_NAME}

    exchange:
        base-currency: USD
        fallback-rate: 27000
        refresh-interval: 7200000  # 2 hours
        api-url: https://api.exchangerate-api.com/v4/latest/
        cache-prefix: exchange_rate

    vietqr:
        url: https://img.vietqr.io/image

    pending-timeout: 120  # seconds
