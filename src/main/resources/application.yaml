spring:
    application:
        name: capstone

    config:
        import: "optional:file:.env[.properties]"

    datasource:
        url: jdbc:mysql://localhost:${MYSQL_PORT}/${MYSQL_DATABASE}
        username: ${MYSQL_USER}
        password: ${MYSQL_PASSWORD}
    
    jpa:
        generate-ddl: true
        hibernate.ddl-auto: none

    devtools:
        restart:
            enabled: true
    data:
        web:
            pageable:
                default-page-size: 20
                max-page-size: 100
                one-indexed-parameters: true   # page starts at 1 instead of 0
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD}
            timeout: 5000ms

#    cache:
#        type:
#            redis:
#                time-to-live: 100000        # ms — entries auto-expire after 10 min
#                cache-null-values: false
#                key-prefix: "products::"
#                use-key-prefix: true

server:
    address: localhost
    port: ${APPLICATION_PORT}

jwt:
    secret: LTKw1Ba/s6nM6PoClDdEwk68UZ7cMBuqNGARAGIFowU=
    expiration: 600000

upload:
    image: ${UPLOAD_IMAGE_PATH}
    default-image: default_cloth.jpg

cache:
    product:
        prefix: product
        all:
            cache-duration: 600000

    brand:
        prefix: brand
        all:
            cache-duration: 600000

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: always
