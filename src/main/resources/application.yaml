spring:
    application:
        name: capstone
    config:
        import: "optional:file:.env[.properties]"

    datasource:
        url: jdbc:mysql://localhost:${MYSQL_PORT}/${MYSQL_DATABASE}
        username: ${MYSQL_USER}
        password: ${MYSQL_PASSWORD}
    
    jpa:
        generate-ddl: true
        hibernate.ddl-auto: none

    devtools:
        restart:
            enabled: true

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD}
            timeout: 5000ms

server:
    address: localhost
    port: ${APPLICATION_PORT}

jwt:
    secret: LTKw1Ba/s6nM6PoClDdEwk68UZ7cMBuqNGARAGIFowU=
    expiration: 600000

